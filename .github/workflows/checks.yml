name: Checks

# Runs the fast checks on every branch push (not tags) so a broken change shows up before a release.
# Plain on purpose: no secrets, read-only, nothing is built for distribution.
on:
  push:
    branches: ['**']

permissions:
  contents: read

# A newer push to the same branch cancels the older run.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      # The shared core is built by Gradle, which npm run check starts.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: npm ci
      - name: Run checks
        run: npm run check

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools'
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      # Icons are generated from assets/icons/icon.svg before the Android build reads them.
      - run: |
          npm ci
          npm run icons:build
      # The shared core is platform-neutral: its JVM and JavaScript tests run here once, not again on Windows.
      - name: Shared core tests (JVM and JavaScript)
        working-directory: core
        run: |
          chmod +x gradlew
          ./gradlew jvmTest jsNodeTest --console=plain
      - name: Android unit tests
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --console=plain
