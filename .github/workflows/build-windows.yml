name: Build Windows

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      handoff:
        # 'cache' hands the files to the release job through the Actions cache (not billed storage);
        # manual builds keep a downloadable artifact.
        type: string
        default: artifact
      tested:
        # true when the Checks workflow already passed on this exact commit: its tests are not run again here.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    # Checks (unless Checks already passed on this commit), the engine smoke and packaging; the UI suites run in
    # the ui job beside it, so the two no longer wait for each other.
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      # The shared core (core/, Kotlin Multiplatform) is built by Gradle into JavaScript before the desktop app uses it.
      # Its own tests run once, on Linux, in Checks and in the Android build.
      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        if: ${{ !inputs.tested }}
        run: npm run check

      # The download and gallery engines are kept between runs. A busy download server (a 504 on 2026-11-05 failed a
      # release) then means "use the verified copy from the last run" instead of a failed build. The fetch still
      # updates them when a newer verified version is out; the smoke test and the packages use this copy.
      - name: Restore the engine tools from the last run
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/tools
          key: engine-tools-${{ github.run_id }}
          restore-keys: engine-tools-

      - name: Fetch the engine tools
        run: npm run tools:fetch

      - name: Keep the engine tools for the next run
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/tools
          key: engine-tools-${{ github.run_id }}

      - name: Run engine smoke test
        run: npm run engine:test

      - name: Build Windows applications
        run: npm run desktop:build -- --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # Cloud accounts: public OAuth client ids from repository variables (Settings > Secrets and variables > Actions > Variables).
          # They are not secrets; an empty one shows that provider as "Not available in this build".
          KEEPFIN_GOOGLE_CLIENT_ID: ${{ vars.KEEPFIN_GOOGLE_CLIENT_ID }}
          KEEPFIN_GOOGLE_CLIENT_SECRET: ${{ vars.KEEPFIN_GOOGLE_CLIENT_SECRET }}
          KEEPFIN_MS_CLIENT_ID: ${{ vars.KEEPFIN_MS_CLIENT_ID }}
          KEEPFIN_DROPBOX_APP_KEY: ${{ vars.KEEPFIN_DROPBOX_APP_KEY }}

      - name: Verify update assets
        run: node scripts/release/verify-update-assets.mjs releases/desktop

      - name: Upload build artifact
        if: inputs.handoff != 'cache'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: keepfin-windows
          path: |
            releases/desktop/*.exe
            releases/desktop/*.exe.blockmap
            releases/desktop/latest.yml
            releases/desktop/*.msi
          if-no-files-found: error
          retention-days: 1

      - name: Collect files for the release job
        if: inputs.handoff == 'cache'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force handoff/windows | Out-Null
          Copy-Item releases/desktop/*.exe, releases/desktop/*.exe.blockmap, releases/desktop/latest.yml, releases/desktop/*.msi handoff/windows/

      - name: Hand files to the release job
        if: inputs.handoff == 'cache'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: handoff/windows
          key: keepfin-windows-${{ github.run_id }}
          enableCrossOsArchive: true

  ui:
    # The UI regression suites in a real browser, beside the packaging job, each on its own runner: flows (~550 user
    # flows), progress isolation, and the ~1,400 layout and accessibility checks split by theme.
    name: ui (${{ matrix.name }})
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: flows, script: gui:flows-test}
          - {name: progress, script: gui:progress-test}
          - {name: layout dark, script: gui:layout-test, theme: dark}
          - {name: layout light, script: gui:layout-test, theme: light}
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      # The renderer imports the shared core's JavaScript build, which Gradle makes.
      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Install dependencies
        run: npm ci

      # Every check opens a fresh browser context with new connections, and Windows holds each closed one for minutes
      # (TIME_WAIT). The fast bundled build used up the default 16,384 ports (ERR_NO_BUFFER_SPACE, then pages hung).
      - name: Allow more network connections
        shell: pwsh
        run: netsh int ipv4 set dynamicport tcp start=10000 num=55535

      - name: Run the ${{ matrix.name }} UI suite
        # The bundled production build loads far faster than the dev server's hundreds of modules, and it is what ships.
        env:
          KEEPFIN_UI_BUILD: '1'
          THEME: ${{ matrix.theme }}
        run: |
          npx playwright install chromium
          npm run core:build
          npm run ${{ matrix.script }}
