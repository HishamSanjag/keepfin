rtwork":{"dictionary":{"bgColor":"090d0e","hasP3":false,"height":1500,"textColor1":"cde0f2","textColor2":"acc1e1","textColor3":"a5b5c4","textColor4":"8b9db7","url":"https://is1-ssl.mzstatic.com/image/thumb/Music115/v4/e8/43/5f/e8435ffa-b6b9-b171-40ab-4ff3959ab661/886443919266.jpg/{w}x{h}bb.{f}","width":1500}},"tallArtwork":{"dictionary":{"bgColor":"0a0c0c","hasP3":true,"height":2732,"textColor1":"ffffff","textColor2":"ffffff","textColor3":"8795ac","textColor4":"717e9c","textGradient":["ffffff","ffffff"],"url":"https://is1-ssl.mzstatic.com/image/thumb/Features221/v4/4a/c2/20/4ac22073-81c4-8dd2-ff93-dd37368c7672/0116173d-c751-4aa0-b6bc-7006c3e6fb35.png/{w}x{h}bb.{f}","width":2048},"cropStyle":"bb"},"title":"Random Access Memories","subtitleLinks":[{"title":"Daft Punk","segue":{"$kind":"flowAction","destination":{"kind":"catalogItemDetailPage","contentDescriptor":{"kind":"artist","identifiers":{"storeAdamID":"5468295"},"url":"https://music.apple.com/us/artist/daft-punk/5468295"},"prominentItemIdentifier":null},"actionMetrics":{"data":[{"fields":{"actionDetails":{"kind":"artist"},"actionUrl":"https://music.apple.com/us/artist/daft-punk/5468295","actionType":"navigate","eventType":"click","targetType":"link","targetId":"5468295","eventVersion":5},"includingFields":["pageFields","impressionsSnapshot","languages","clickLocation"],"excludingFields":[],"topic":"xp_its_music_main","shouldFlush":false}],"custom":{}}}}],"tertiaryTitleLinks":null,"quaternaryTitle":"Pop · 2013","modalPresentationDescriptor":{"headerTitle":"Random Access Memories","headerSubtitle":"Daft Punk · 2013","paragraphText":"There is an early Daft Punk track named “Teachers” that, effectively, served as a roll call for the French duo’s influences: Paul Johnson, DJ Funk, DJ Sneak. Within the context of 1997’s <i>Homework</i>, “Teachers” presented the group as bright kids ready to absorb the lessons of those who came before them. But it also marked Daft Punk as a group with a strong, dynamic relationship to the past whose music served an almost dialogic function: They weren’t just expressing themselves, they were talking to their inspirations—a conversation that spanned countries, decades, styles and technological revolutions. So while the live-band-driven sound of 2013’s <i>Random Access Memories</i> was a curveball, it was also a logical next step.<br />\nThe theatricality that had always been part of their stage show and presentation found its musical outlet (“Giorgio by Moroder,” the Paul Williams feature “Touch”), and the soft-rock panache they started playing with on 2001’s <i>Discovery</i> got a fuller, more earnest treatment (“Within,” the Julian Casablancas feature “Instant Crush,” the I-can’t-believe-it’s-not-The-Doobie-Brothers moves of “Fragments of Time”). The concept, as much as the album had one, was to suggest that as great as our frictionless digital world may be, there was a sense of adventurousness and connection to the spirit of the ’70s that, if not lost, had at least been subdued. “Touch” was “All You Need Is Love” for the alienation of a post-<i>Space Odyssey</i> universe; “Give Life Back to Music” wasn’t just there to set the scene, it was a command—just think of all the joy music has brought <i>you</i>. “Get Lucky” and “Lose Yourself to Dance”—spotlights both for Pharrell and the pioneering work of Chic’s Nile Rodgers—recaptured the innocence of early disco and invited their audience to do the same.<br /> \nThere was joy in it, but there was melancholy, too: Here was a world seen through the rearview, beautiful in part because you couldn’t quite go back to it. “As we look back at the Earth, it’s, uh, up at about 11 o’clock, about, uh, well, maybe 10 or 12 diameters,” the sampled voice of astronaut Eugene Cernan says on “Contact.” “I don't know whether that does you any good. But there's somethin’ out there.” This was the Apollo 17 mission, December 1972. It remains the last time humans have been on the moon."},"showExplicitBadge":false,"audioBa
