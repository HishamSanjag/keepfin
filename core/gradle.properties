org.gradle.jvmargs=-Xmx2g
org.gradle.caching=false
# Kotlin/JS uses npm and the Node.js already installed (see build.gradle.kts); no yarn download.
kotlin.js.yarn=false
kotlin.js.ir.output.granularity=whole-program
# Incremental Kotlin/JS builds corrupted lone-surrogate string literals in the JSON tests after an edit (Kotlin 2.4.20,
# Windows, 2026-10-12); a clean build was fine. The JS build is small, so it always compiles in full.
kotlin.incremental.js.ir=false
