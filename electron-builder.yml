appId: app.keepfin.desktop
productName: Keepfin
publish:
  provider: github
  owner: HishamSanjag
  repo: keepfin
  releaseType: release
  # Beta builds keep the stable channel file (latest.yml), so testers are offered the final release.
  channel: latest
directories:
  output: releases/desktop
  buildResources: assets/icons
icon: assets/icons/icon.png
files:
  - build/desktop/**
  - build/web/**
  - assets/icons/icon.png
  - package.json
extraResources:
  # License texts travel with the program as plain files; they are not shown in the UI.
  - from: LICENSE
    to: licenses/LICENSE.txt
  - from: THIRD-PARTY-NOTICES.md
    to: licenses/THIRD-PARTY-NOTICES.md
  - from: licenses/Apache-2.0.txt
    to: licenses/Apache-2.0.txt
  - from: licenses/Manrope-OFL.txt
    to: licenses/Manrope-OFL.txt
  - from: licenses/Inter-OFL.txt
    to: licenses/Inter-OFL.txt
  - from: resources/app-icons
    to: app-icons
  - from: build/tools
    to: tools
    filter:
      - '*.exe'
      - tools.json
asarUnpack:
  - node_modules/ffmpeg-static/**
win:
  target:
    - nsis
    - portable
    - msi
  icon: assets/icons/icon.ico
  signExecutable: false
nsis:
  artifactName: Keepfin-Setup-${version}.${ext}
  oneClick: false
  shortcutName: Keepfin
  uninstallDisplayName: Keepfin
  allowToChangeInstallationDirectory: true
  installerIcon: assets/icons/icon.ico
  uninstallerIcon: assets/icons/icon.ico
  # Branded artwork (option A, "Graphite"), generated by scripts/build/build-installer-art.mjs; images only, no run-time cost.
  installerSidebar: assets/installer/sidebar.bmp
  uninstallerSidebar: assets/installer/sidebar.bmp
  installerHeader: assets/installer/header.bmp
  # a welcome page and the cobalt line under the header
  include: assets/installer/installer.nsh
  runAfterFinish: true
portable:
  artifactName: Keepfin-Portable-${version}.${ext}
# For IT and managed installs (Group Policy, Intune). It is updated by installing the next MSI; the app shows Releases
# instead of updating itself, as the portable edition does. It adds no firewall rule: Devices offers "Allow Keepfin".
msi:
  artifactName: Keepfin-${version}.${ext}
  perMachine: true
  shortcutName: Keepfin
  runAfterFinish: true
mac:
  target: dmg
linux:
  target: AppImage
